[project]
name = "chupa"
version = "0.1.0"
description = "Continuously running orchestration engine that authors and runs tickets against host repos."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-n auto"
# 120s leaves room for the slowest loaded test; thread also stops blocked workers and dumps stacks.
timeout = 120
timeout_method = "thread"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout==2.5.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 200
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Shared fixture imports are required by pytest.
"tests/*" = ["F401", "F811"]
# Tests match these import lines as text.
"chupa/__main__.py" = ["I001"]
# The core template and its expected bytes are long by design.
"chupa/hostfiles.py" = ["E501"]
"tests/test_hostfiles.py" = ["E501"]
