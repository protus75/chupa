# Instance config (host plane; schema in chupa/docs/host-contract.md). Operator-owned: edit between runs.
# Both providers are kind: cli on ambient CLI login, so no `auth` and no key export. IMPLEMENT/AUTHOR inherit models_by_tier[tier]; REVIEW pins
# claude's strongest model at every tier (diversity from codex IMPLEMENT is a preference, not a gate).
schema_version: 1
state_dir: .chupa/state
providers:
  - name: claude
    kind: cli
    package: "@anthropic-ai/claude-code"
    models_by_tier: {low: claude-sonnet-5-5, medium: claude-sonnet-5-5, high: claude-opus-5-5, max: claude-opus-5-5}
    limits: {concurrency: 1}  # stream reports total_cost_usd: no estimate needed
  - name: codex
    kind: cli
    package: "@openai/codex"
    models_by_tier: {low: gpt-6-luna, medium: gpt-6.1-terra, high: gpt-6.1-sol, max: gpt-6-astra}
    limits: {concurrency: 1, est_cost_per_call_usd: 1.00}  # stream reports no cost; flat subscription
routing:
  - {tier: low, surface: implement, candidates: [{provider: codex}]}
  - {tier: low, surface: author, candidates: [{provider: claude}]}
  - {tier: low, surface: review, candidates: [{provider: claude, model: claude-opus-5-5}]}
  - {tier: medium, surface: implement, candidates: [{provider: codex}]}
  - {tier: medium, surface: author, candidates: [{provider: claude}]}
  - {tier: medium, surface: review, candidates: [{provider: claude, model: claude-opus-5-5}]}
  - {tier: high, surface: implement, candidates: [{provider: codex}]}
  - {tier: high, surface: author, candidates: [{provider: claude}]}
  - {tier: high, surface: review, candidates: [{provider: claude, model: claude-opus-5-5}]}
  - {tier: max, surface: implement, candidates: [{provider: codex}]}
  - {tier: max, surface: author, candidates: [{provider: claude}]}
  - {tier: max, surface: review, candidates: [{provider: claude, model: claude-opus-5-5}]}
review:
  autofix:
    - {code: ruff-fix, argv: [uv, run, ruff, check, --fix, --exit-zero], files: ["*.py"]}
    - {code: ruff-format, argv: [uv, run, ruff, format], files: ["*.py"]}
  mechanical:
    - code: unit
      argv: [uv, run, python, -m, chupa, covgate, --, python, -m, pytest, tests/unit, -p, chupa.testguard, -p, chupa.testreport, --chupa-results, .chupa/results/unit.json, --cov=chupa, --cov-branch, --cov-context=test, --cov-report=json:coverage.json, -n, auto]
      trigger: always
      severity: hard
      results: .chupa/results/unit.json
      coverage: coverage.json
    - code: integration
      argv: [uv, run, python, -m, pytest, tests/integration, -p, chupa.testreport, --chupa-results, .chupa/results/integration.json, -n, auto]
      trigger: always
      severity: hard
      results: .chupa/results/integration.json
    - {code: lint, argv: [uv, run, ruff, check, .], trigger: always, severity: hard}
    - {code: format, argv: [uv, run, ruff, format, --check, .], trigger: always, severity: hard}
  coverage_map:
    argv: [uv, run, pytest, -q, --cov=chupa, --cov=eval, --cov-context=test, --cov-report=json:.chupa/coverage.json]
    report: .chupa/coverage.json
merge: {}
drain:
  max_ticket_minutes: 180  # raised from the shipped 90 to admit the Phase 2 seeds' largest stuck budget (section 18)
caps:
  premise_bounce: 2  # a fixed ticket.md re-offers a premise park without an operator keep; the second bounce still needs one
engine_plane_safety_inventory: [chupa/specs/, chupa/gates.py, chupa/config.py, chupa/providers.py, config.yaml, test-gate.toml]
