# Instance config (host plane, CHUPA_PLAN.md section 15). Operator-owned: edit between runs.
# Provider values from bootstrap/operator-setup.md. Both providers are kind: cli on ambient CLI
# login, so no `auth` and no key export. IMPLEMENT/AUTHOR inherit models_by_tier[tier]; REVIEW pins
# claude's strongest model at every tier (diversity from codex IMPLEMENT is a preference, not a gate).
schema_version: 1
state_dir: .chupa/state
providers:
  - name: claude
    kind: cli
    models_by_tier: {low: claude-sonnet-5-5, medium: claude-sonnet-5-5, high: claude-opus-5-5, max: claude-opus-5-5}
    limits: {concurrency: 1}  # stream reports total_cost_usd: no estimate needed
  - name: codex
    kind: cli
    models_by_tier: {low: gpt-6-luna, medium: gpt-5.6-terra, high: gpt-6.1-sol, max: gpt-6.1-sol}
    limits: {concurrency: 1, est_cost_per_call_usd: 1.00}  # stream reports no cost; flat subscription
routing:
  - {tier: low, surface: implement, candidates: [{provider: codex}]}
  - {tier: low, surface: author, candidates: [{provider: claude}]}
  - {tier: low, surface: review, candidates: [{provider: claude, model: claude-opus-5-5}]}
  - {tier: medium, surface: implement, candidates: [{provider: codex}]}
  - {tier: medium, surface: author, candidates: [{provider: claude}]}
  - {tier: medium, surface: review, candidates: [{provider: claude, model: claude-opus-5-5}]}
  - {tier: high, surface: implement, candidates: [{provider: codex}]}
  - {tier: high, surface: author, candidates: [{provider: claude}]}
  - {tier: high, surface: review, candidates: [{provider: claude, model: claude-opus-5-5}]}
  - {tier: max, surface: implement, candidates: [{provider: codex}]}
  - {tier: max, surface: author, candidates: [{provider: claude}]}
  - {tier: max, surface: review, candidates: [{provider: claude, model: claude-opus-5-5}]}
review: {}
merge: {}
drain:
  max_ticket_minutes: 180  # raised from the shipped 90 to admit the Phase 2 seeds' largest stuck budget (section 18)
engine_plane_safety_inventory: [specs/, chupa/gates.py, chupa/config.py, chupa/providers.py, config.yaml]
